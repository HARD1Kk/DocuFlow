[project]
name = "rag-system"
version = "0.1.0"
description = "A Rag system"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
  "langchain-community>=0.4.1",
  "llama-index>=0.14.13",
  "chromadb>=1.4.1",
  "flagembedding>=1.3.5",
  "langchain>=1.2.7",
  "langchain-text-splitters>=0.2.0",
  "pydantic-settings>=2.12.0",
  "pymupdf>=1.26.6",
  "pymupdf-layout>=1.26.6",
  "pymupdf4llm>=0.2.9",
  "transformers>=5.4.0",
  "torch>=2.10.0",
  "python-docx>=1.2.0",
  "numpy<2.0",
  "pillow>=12.1.0",
  "pip>=26.0.1",
  "opencv-python>=4.11.0.86",
  "easyocr>=1.7.1",
  "docling>=2.92.0",
  "socksio>=1.0.0",
  "openpyxl>=3.1.0",
  "xlrd>=2.0.0",
  "pandas>=2.0.0",
  "paddleocr>=3.7.0",
  "paddlepaddle>=3.3.1",
]

[tool.ruff]
line-length = 120

target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]



[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
strict = true
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = ["src"]

[dependency-groups]
dev = [
  "bump-pydantic>=0.8.0",
  "mypy>=1.19.1",
  "pytest>=9.0.2",
  "ruff>=0.14.14",
  "taplo>=0.9.3",
  "ty>=0.0.15",
  "vulture>=2.14",
]
